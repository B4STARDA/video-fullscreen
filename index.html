<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Video</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: black;
        font-family: Arial, sans-serif;
    }

    /* VIDEO */
    video {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 100%;
        height: 100%;
        transform: translate(-50%, -50%);
        object-fit: cover; /* Default: llenar pantalla */
        background: black;
    }

    /* BUTTONS */
    .controls {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 10;
        display: flex;
        gap: 10px;
    }

    button {
        padding: 10px 16px;
        font-size: 14px;
        cursor: pointer;
        border: none;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.8);
    }

    button:hover {
        background: white;
    }
</style>
</head>

<body>

<div class="controls">
    <button id="soundBtn">🔈 Activate Sound</button>
    <button id="fitBtn">🔲 Fit Video</button>
</div>

<video id="video" autoplay loop playsinline muted>
    <source src="tu-video.mp4" type="video/mp4" />
    Your browser does not support the video tag.
</video>

<script>
const video = document.getElementById("video");
const soundBtn = document.getElementById("soundBtn");
const fitBtn = document.getElementById("fitBtn");

// ---- SOUND BUTTON ----
soundBtn.addEventListener("click", () => {
    video.muted = false;
    video.play();
    soundBtn.textContent = "🔊 Sound On";
});

// ---- FIT / FILL BUTTON ----
let isFit = false;

fitBtn.addEventListener("click", () => {
    if (!isFit) {
        video.style.objectFit = "contain"; 
        fitBtn.textContent = "⬜ Fill Screen";
        isFit = true;
    } else {
        video.style.objectFit = "cover";
        fitBtn.textContent = "🔲 Fit Video";
        isFit = false;
    }
});
</script>

</body>
</html>
